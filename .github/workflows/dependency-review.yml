# Checks the dependencies a pull request adds or changes against the GitHub
# Advisory Database, and fails if any has a known vulnerability of high or
# critical severity.
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
