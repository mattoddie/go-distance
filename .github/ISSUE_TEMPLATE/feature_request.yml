name: Feature request
description: Suggest a new unit, API or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: For new API, include an example of how you would call it.
    validations:
      required: true
